# SonarQube — fe_cyberxatria (Next.js)
# Host / token / project key come from env or `npm run sonar`.
# Do not commit SONAR_TOKEN.

sonar.projectKey=fe_cyberxatria
sonar.projectName=FE CyberXatria
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/coverage/**,**/.scannerwork/**

sonar.typescript.tsconfigPath=tsconfig.json

# Do not let .gitignore hide application sources from the scanner.
sonar.scm.exclusions.disabled=true
